# LOCAL DEVELOPMENT ONLY. The ":-rental" fallbacks are throwaway credentials for a database
# that is only reachable from this machine. Override them via .env; never use this file
# for a hosted deployment (Render provides DATABASE_URL, see render.yaml).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rental}
      POSTGRES_DB: ${POSTGRES_DB:-rental_desk}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rental} -d ${POSTGRES_DB:-rental_desk}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rental}:${POSTGRES_PASSWORD:-rental}@db:5432/${POSTGRES_DB:-rental_desk}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Reviewer test clock (X-Test-Clock header). Set ALLOW_TEST_CLOCK=false in .env to refuse it.
      ALLOW_TEST_CLOCK: ${ALLOW_TEST_CLOCK:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_ENABLE_TEST_CLOCK: ${VITE_ENABLE_TEST_CLOCK:-false}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
