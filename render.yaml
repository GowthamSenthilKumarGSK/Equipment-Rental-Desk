# Render Blueprint: API + Postgres. The frontend is deployed separately on Vercel (frontend/vercel.json).
services:
  - type: web
    name: rental-desk-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rental-desk-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set in the Render dashboard to the Vercel URL
      - key: LOG_LEVEL
        value: INFO
      # Reviewer test clock. "true" lets anyone who can reach the API send X-Test-Clock (the API has
      # no authentication), so set it to "false" and redeploy once the review is over. A value set
      # only in the dashboard is overwritten the next time this blueprint is synced.
      - key: ALLOW_TEST_CLOCK
        value: "true"

databases:
  - name: rental-desk-db
    plan: free
