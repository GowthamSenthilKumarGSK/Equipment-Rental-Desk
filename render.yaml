# Render Blueprint: API + Postgres. The frontend is deployed separately on Vercel (frontend/vercel.json).
services:
  - type: web
    name: rental-desk-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rental-desk-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set in the Render dashboard to the Vercel URL
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: rental-desk-db
    plan: free
